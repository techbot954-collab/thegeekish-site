<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Apple Music gray song illustration</title>
  <desc id="desc">A stylized playlist with one gray unavailable track and a bright music note.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a2f"/>
      <stop offset="0.55" stop-color="#26395c"/>
      <stop offset="1" stop-color="#f05a7e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#eaf2ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="122" r="92" fill="#ffd166" opacity="0.94"/>
  <circle cx="146" cy="520" r="132" fill="#4ecdc4" opacity="0.28"/>
  <g transform="translate(120 86)">
    <rect width="660" height="458" rx="32" fill="url(#panel)"/>
    <rect x="44" y="44" width="188" height="188" rx="30" fill="#161b33"/>
    <path d="M159 88v82c0 24-20 43-46 43-23 0-40-14-40-32 0-20 18-34 43-34 8 0 15 1 21 4V97l94-20v42l-72 15z" fill="#ff5a7a"/>
    <text x="270" y="91" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#151826">Playlist check</text>
    <text x="270" y="134" font-family="Inter, Arial, sans-serif" font-size="22" fill="#536071">When a track goes gray</text>
    <g font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">
      <rect x="44" y="270" width="572" height="54" rx="16" fill="#f5f7fb"/>
      <circle cx="76" cy="297" r="12" fill="#ff5a7a"/>
      <text x="104" y="305" fill="#20263a">Sync Library status</text>
      <rect x="44" y="342" width="572" height="54" rx="16" fill="#d8dee9"/>
      <circle cx="76" cy="369" r="12" fill="#8c95a3"/>
      <text x="104" y="377" fill="#737d8d">Unavailable song</text>
      <rect x="44" y="414" width="572" height="54" rx="16" fill="#f5f7fb"/>
      <circle cx="76" cy="441" r="12" fill="#4ecdc4"/>
      <text x="104" y="449" fill="#20263a">Redownload and retry</text>
    </g>
  </g>
  <g transform="translate(810 236)">
    <rect width="260" height="154" rx="28" fill="#101728" opacity="0.92"/>
    <text x="32" y="58" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="900" fill="#fff">GEEKISH</text>
    <text x="32" y="99" font-family="Inter, Arial, sans-serif" font-size="21" fill="#dfe8ff">quick read</text>
    <path d="M202 42l22 22-22 22" fill="none" stroke="#4ecdc4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
