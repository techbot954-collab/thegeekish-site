  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="58" y="50" width="1084" height="530" rx="34" fill="#fffaf3" opacity=".93" filter="url(#shadow)"/>
  <text x="90" y="112" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#ff5a3d">LAPTOP CARE</text>
  <text x="90" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="700" fill="#151515">Cleaning a laptop fan</text>
  <text x="90" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="700" fill="#151515">starts outside the case</text>
  <text x="90" y="318" font-family="Inter, Arial, sans-serif" font-size="27" fill="#6d665f">A small maintenance job gets risky fast when</text>
  <text x="90" y="356" font-family="Inter, Arial, sans-serif" font-size="27" fill="#6d665f">you rush for a screwdriver.</text>
  <rect x="250" y="180" width="700" height="290" rx="28" fill="#1e2734"/>
  <rect x="300" y="220" width="600" height="200" rx="18" fill="#f6f3ee"/>
  <g transform="translate(600 320)">
    <circle r="82" fill="#151515"/>
    <path d="M0 0 L70 -26 L70 26 Z" fill="#246bfe" transform="rotate(0)"/>
    <path d="M0 0 L70 -26 L70 26 Z" fill="#246bfe" transform="rotate(60)"/>
    <path d="M0 0 L70 -26 L70 26 Z" fill="#246bfe" transform="rotate(120)"/>
    <path d="M0 0 L70 -26 L70 26 Z" fill="#246bfe" transform="rotate(180)"/>
    <path d="M0 0 L70 -26 L70 26 Z" fill="#246bfe" transform="rotate(240)"/>
    <path d="M0 0 L70 -26 L70 26 Z" fill="#246bfe" transform="rotate(300)"/>
