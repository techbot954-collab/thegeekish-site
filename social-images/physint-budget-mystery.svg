<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Physint budget mystery illustration</title>
  <desc id="desc">A stealth game briefing board with a question-mark budget meter and spy silhouettes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".52" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="116" y="96" width="968" height="708" rx="36" fill="#111827" stroke="#86efac" stroke-width="8"/>
  <text x="178" y="178" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">PHYSINT BUDGET FILE</text>
  <rect x="178" y="230" width="844" height="88" rx="18" fill="#052e16"/>
  <text x="214" y="288" fill="#bbf7d0" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800">$400M CLAIM: UNCONFIRMED</text>
  <g transform="translate(188 386)">
    <rect width="360" height="248" rx="24" fill="#e5e7eb"/>
    <circle cx="180" cy="88" r="54" fill="#111827"/>
    <path d="M96 220 C120 150 240 150 264 220" fill="#111827"/>
    <rect x="58" y="26" width="244" height="28" rx="14" fill="#16a34a"/>
    <text x="72" y="236" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">STEALTH MODE</text>
  </g>
  <g transform="translate(630 386)" font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <circle cx="174" cy="118" r="112" fill="#facc15"/>
    <text x="124" y="154" fill="#111827" font-size="118">?</text>
    <text x="0" y="274" fill="#f8fafc" font-size="34">REAL NUMBER TBD</text>
  </g>
  <g stroke="#22c55e" stroke-width="8" stroke-linecap="round" opacity=".72">
    <path d="M214 704 H990"/>
    <path d="M300 704 C360 640 430 640 490 704"/>
    <path d="M584 704 C660 596 740 596 818 704"/>
  </g>
  <text x="178" y="756" fill="#a7f3d0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">RUMOR CONTROL, NOT A BUDGET REVEAL</text>
</svg>
