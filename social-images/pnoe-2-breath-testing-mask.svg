<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Self-serve breath testing mask illustration</title>
  <desc id="desc">A sleek metabolic breath-testing mask beside oxygen, carbon dioxide, and VO2 max readouts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".48" stop-color="#155e75"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="210" cy="165" r="92" fill="#67e8f9" opacity=".2"/>
  <circle cx="990" cy="760" r="145" fill="#bef264" opacity=".16"/>
  <rect x="108" y="96" width="984" height="708" rx="48" fill="#ecfeff" opacity=".96"/>
  <text x="170" y="178" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">SELF-SERVE BREATH TEST</text>
  <text x="174" y="214" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">VO2 MAX / METABOLIC RATE / FLEXIBILITY</text>
  <g transform="translate(170 290)">
    <path d="M246 26 C350 30 426 112 426 230 C426 338 350 430 246 438 C142 430 66 338 66 230 C66 112 142 30 246 26Z" fill="url(#mask)" stroke="#0f172a" stroke-width="8"/>
    <path d="M128 212 C184 176 308 176 364 212 L338 346 C280 386 212 386 154 346 Z" fill="#0f172a"/>
    <path d="M176 232 C216 254 276 254 316 232" fill="none" stroke="#67e8f9" stroke-width="16" stroke-linecap="round"/>
    <circle cx="190" cy="142" r="28" fill="#ffffff"/>
    <circle cx="302" cy="142" r="28" fill="#ffffff"/>
    <path d="M66 230 C10 190 -16 128 14 86" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
    <path d="M426 230 C482 190 508 128 478 86" fill="none" stroke="#0f172a" stroke-width="18" stroke-linecap="round"/>
  </g>
  <g transform="translate(650 302)" font-family="Arial, Helvetica, sans-serif">
    <rect width="360" height="88" rx="20" fill="#0f172a"/>
    <text x="28" y="56" fill="#ffffff" font-size="28" font-weight="800">8-minute session</text>
    <rect y="126" width="360" height="88" rx="20" fill="#155e75"/>
    <text x="28" y="182" fill="#ffffff" font-size="28" font-weight="800">O2 + CO2 analysis</text>
    <rect y="252" width="360" height="88" rx="20" fill="#0f766e"/>
    <text x="28" y="308" fill="#ffffff" font-size="28" font-weight="800">Wellness, not diagnosis</text>
  </g>
  <rect x="214" y="704" width="772" height="56" rx="28" fill="#0f172a"/>
  <text x="264" y="742" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">LAB-GRADE FITNESS DATA TRIES TO GO MAINSTREAM</text>
</svg>
