  <text x="520" y="250" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" fill="#fffaf3">DIALOGUE</text>
  <g fill="none" stroke="#246bfe" stroke-width="4" opacity=".55">
    <path d="M345 235 C470 350 730 350 855 235"/>
    <path d="M370 230 C490 390 710 390 830 230"/>
