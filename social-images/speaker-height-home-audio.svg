  <text x="112" y="318" font-family="Inter, Arial, sans-serif" font-size="27" fill="#6d665f">Engadget says too much height can make</text>
  <text x="112" y="356" font-family="Inter, Arial, sans-serif" font-size="27" fill="#6d665f">dialogue and fine details less direct.</text>
