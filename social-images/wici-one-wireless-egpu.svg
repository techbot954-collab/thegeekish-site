    <rect x="455" y="287" width="270" height="336" rx="30" fill="#222"/>
    <rect x="500" y="345" width="180" height="165" rx="24" fill="url(#chip)"/>
    <circle cx="590" cy="427" r="52" fill="#fffaf3" opacity=".92"/>
    <path d="M549 427h82M590 386v82" stroke="#151515" stroke-width="16" stroke-linecap="round"/>
    <g stroke="#fffaf3" stroke-width="10" opacity=".78">
      <path d="M486 322h208M486 548h208"/>
      <path d="M486 582h208"/>
    </g>
  </g>
  <g filter="url(#shadow)">
    <rect x="95" y="548" width="330" height="205" rx="24" fill="#fffaf3"/>
    <rect x="126" y="580" width="268" height="130" rx="13" fill="#151515"/>
    <rect x="146" y="600" width="228" height="90" rx="10" fill="#246bfe"/>
    <path d="M159 670l53-47 44 35 38-30 61 62H159z" fill="#bdf0ff"/>
    <rect x="80" y="758" width="360" height="28" rx="14" fill="#d7cec2"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="785" y="545" width="180" height="250" rx="28" fill="#fffaf3"/>
    <rect x="805" y="575" width="140" height="184" rx="18" fill="#151515"/>
    <circle cx="875" cy="671" r="54" fill="#ff5a3d"/>
    <path d="M850 671l38-25v50z" fill="#fffaf3"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="915" y="360" width="210" height="126" rx="28" fill="#fffaf3"/>
    <rect x="943" y="388" width="154" height="70" rx="16" fill="#151515"/>
    <path d="M968 424h104" stroke="#4ce3a0" stroke-width="14" stroke-linecap="round"/>
  </g>
