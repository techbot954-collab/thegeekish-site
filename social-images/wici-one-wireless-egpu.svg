  <text x="76" y="105" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" fill="#151515">WIRELESS GPU</text>
  <text x="78" y="156" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#6d665f">one box, many screens</text>
