<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Wireless external GPU concept</title>
  <desc id="desc">Illustration of a wireless external GPU sending game graphics to several devices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4de"/>
      <stop offset=".48" stop-color="#d8f3ff"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" x2="1">
      <stop offset="0" stop-color="#ff5a3d"/>
      <stop offset="1" stop-color="#246bfe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#17120e" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="170" fill="#fffaf3" opacity=".18"/>
  <circle cx="170" cy="760" r="230" fill="#ff5a3d" opacity=".16"/>
  <g fill="none" stroke="#fffaf3" stroke-width="13" stroke-linecap="round" opacity=".8">
    <path d="M605 302c140-84 289-76 405 22"/>
    <path d="M650 386c87-48 181-43 251 20"/>
    <path d="M701 466c42-22 86-18 122 15"/>
  </g>
